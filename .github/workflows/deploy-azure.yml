name: Deploy to Azure

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/mlops-model-api:${{ github.sha }} .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/mlops-model-api:${{ github.sha }}
      - name: Deploy
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update               --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}"               --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"               --image "${{ secrets.ACR_LOGIN_SERVER }}/mlops-model-api:${{ github.sha }}"
