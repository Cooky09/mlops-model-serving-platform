name: Deploy to Azure

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/mlops-model-api:${{ github.sha }} .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/mlops-model-api:${{ github.sha }}
      - name: Deploy
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "${{ secrets.ACR_LOGIN_SERVER }}/mlops-model-api:${{ github.sha }}" \
              --set-env-vars \
                MLFLOW_TRACKING_URI="${{ secrets.MLFLOW_TRACKING_URI }}" \
                MLFLOW_MODEL_NAME="ticket_classifier" \
                MLFLOW_MODEL_ALIAS="production"
      - name: Check deployment health
        uses: azure/cli@v2
        with:
          inlineScript: |
            FQDN=$(az containerapp show \
              --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)

            echo "Checking https://${FQDN}/health"

            for i in {1..12}; do
              if curl --fail --silent --show-error "https://${FQDN}/health"; then
                echo "Deployment health check passed."
                exit 0
              fi

              echo "Health check attempt ${i}/12 failed; waiting 10 seconds..."
              sleep 10
            done

            echo "Deployment health check failed."
            exit 1
